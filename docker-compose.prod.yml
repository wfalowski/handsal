# Production: one Handsal image + PostgreSQL.
#   cp .env.example .env   # then set PUBLIC_URL, KEY_ENCRYPTION_SECRET, POSTGRES_PASSWORD, BOOTSTRAP_ADMIN_*
#   docker compose -f docker-compose.prod.yml up -d
# Put a TLS-terminating reverse proxy in front of :3000 and set TRUST_PROXY=true.
services:
  handsal:
    image: ghcr.io/wfalowski/handsal:latest   # or: build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://handsal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/handsal
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: handsal
      POSTGRES_USER: handsal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handsal -d handsal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
