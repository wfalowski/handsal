name: Landing

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "docs/overview.md"
      - "docs/overview.pl.md"
      - "docs/sdk.md"
      - "docs/sdk.pl.md"
      - "docs/integration.md"
      - "docs/deployment.md"
      - "docs/api.md"
      - ".github/workflows/pages.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/site/**"
      - "docs/overview.md"
      - "docs/overview.pl.md"
      - "docs/sdk.md"
      - "docs/sdk.pl.md"
      - "docs/integration.md"
      - "docs/deployment.md"
      - "docs/api.md"
      - ".github/workflows/pages.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A secret cannot be read from a step `if`. Either a secret or a variable turns deploy on.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_GITHUB_URL: https://github.com/${{ github.repository }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm --filter @handsal/site build
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/site/dist --project-name=handsal --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
