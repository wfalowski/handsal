name: Docker

# push to main → release job publishes :latest + :<sha>, and :version + :stable when it cuts a tag
# tag v* or a manual run → build-and-push publishes the semver tags
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Conventional Commits choose the next semver. Pushes made with the
  # default token do not start a new run, so this job also publishes the
  # image: :latest for every main push, and :X.Y.Z plus :stable when it
  # created a tag.
  release:
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Remember existing tags
        run: git tag --list 'v[0-9]*' | sort > "$RUNNER_TEMP/tags-before"
      - name: Baseline tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git tag --list 'v[0-9]*')" ]; then
            git tag -a v0.0.1 -m "v0.0.1"
            git push origin v0.0.1
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
      - name: Resolve image tags
        id: released
        run: |
          git fetch origin main --tags
          git checkout --detach origin/main
          newest="$(comm -13 "$RUNNER_TEMP/tags-before" <(git tag --list 'v[0-9]*' | sort) | sort -V | tail -n 1)"
          version="${newest#v}"
          if [ -n "$newest" ]; then yes=true; else yes=false; version=0.0.0; fi
          {
            echo "yes=$yes"
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.released.outputs.sha }}
            type=raw,value=latest
            type=raw,value=${{ steps.released.outputs.version }},enable=${{ steps.released.outputs.yes == 'true' }}
            type=raw,value=${{ steps.released.outputs.minor }},enable=${{ steps.released.outputs.yes == 'true' }}
            type=raw,value=stable,enable=${{ steps.released.outputs.yes == 'true' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    needs: ci
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
